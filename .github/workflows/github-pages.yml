name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:  # validate docs build on PRs (build only, no deploy)
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read  # least privilege at workflow level; deploy job adds its own

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPHINXOPTS: "-W --keep-going"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build documentation
        run: uv run make -C docs html

      - name: Disable Jekyll
        run: touch docs/build/html/.nojekyll

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only master pushes and published releases may touch the live site -
    # develop pushes and PRs stop after the build job.
    if: github.ref == 'refs/heads/master' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # deploy to Pages
      id-token: write  # verify the deployment's origin
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}   # surfaces the site URL in the job summary
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
